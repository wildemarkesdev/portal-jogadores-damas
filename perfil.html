<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Perfil do Jogador - Portal do Damista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #F3F4F0;
      --surface: #FFFFFF;
      --ink: #16201B;
      --muted: #56635C;
      --line: #D6DBD4;
      --accent: #1E6A4C;
      --accent-soft: #E1EEE7;
      --gold: #C69C6D;
      --gold-soft: #F8F1E5;
      --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --f-body: "Public Sans", system-ui, -apple-system, sans-serif;
      --f-mono: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--ink); font-family: var(--f-body); margin: 0; line-height: 1.6; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    a { color: var(--accent); text-decoration: none; }
    h1, h2, h3 { font-family: var(--f-display); margin: 0; }
    h2 { font-size: 2.5rem; text-transform: uppercase; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; background: var(--accent); color: white; border-radius: 6px; font-weight: 600; border: 2px solid var(--accent); cursor: pointer; transition: 0.2s; }
    .btn:hover { background: transparent; color: var(--accent); }
    .btn.ghost { background: transparent; color: var(--accent); }
    .btn.ghost:hover { background: var(--accent); color: white; }
    
    header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    header.top .wrap { display: flex; justify-content: space-between; align-items: center; min-height: 64px; }
    .brand { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; text-transform: uppercase; color: var(--ink); display: flex; align-items: center; gap: 8px; }
    .brand-mark { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 16px; height: 16px; }
    .brand-mark i { background: var(--accent); }
    nav.menu { display: flex; gap: 24px; align-items: center; }
    nav.menu a { font-weight: 600; color: var(--ink); }
    nav.menu a:hover { color: var(--accent); }
    nav.menu a.cta { background: var(--ink); color: white; padding: 6px 14px; border-radius: 4px; }
    nav.menu a.cta:hover { background: var(--accent); }

    .perfil-container { display: flex; gap: 40px; margin-top: 60px; align-items: flex-start; }
    .perfil-foto { width: 300px; height: 300px; border-radius: 16px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 4px solid var(--surface); }
    .perfil-info { flex: 1; }
    .perfil-info h2 { font-size: 3.5rem; margin-bottom: 10px; }
    .perfil-cidade { font-family: var(--f-mono); font-size: 1rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; display: block; margin-bottom: 24px; }
    .perfil-bio { font-size: 1.15rem; color: var(--ink); max-width: 60ch; margin-bottom: 30px; }
    
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
    .info-box { background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--line); }
    .info-label { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; display: block; }
    .info-value { font-weight: 600; font-size: 1.1rem; }

    .loading { text-align: center; padding: 100px; font-size: 1.2rem; color: var(--muted); }

    @media(max-width: 768px) {
      .perfil-container { flex-direction: column; }
      .perfil-foto { width: 100%; height: auto; aspect-ratio: 1; }
      nav.menu { flex-wrap: wrap; gap: 12px; }
      .brand { font-size: 1.1rem; }
      .perfil-info h2 { font-size: 2.5rem; }
    }
    @media(max-width: 480px) {
      .info-grid { grid-template-columns: 1fr; }
      .perfil-info h2 { font-size: 2rem; }
      header.top .wrap { flex-direction: column; gap: 12px; padding-block: 12px; }
      nav.menu { justify-content: center; width: 100%; }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="brand-mark"><i></i><i></i><i></i><i></i></span>Portal do Damista</a>
      <nav class="menu">
        <a href="index.html">Início</a>
        <a href="cursos.html">Cursos</a>
        <a href="index.html#jogadores">Mural</a>
        <a href="cadastro.html" class="cta">Fazer Cadastro</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <a href="index.html#jogadores" class="btn ghost" style="margin-top: 40px; padding: 8px 16px;">&larr; Voltar ao Mural</a>
    
    <div id="conteudo-perfil">
      <div class="loading">Carregando informações do jogador...</div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD12ju4vDeznTlfXGKtgGSVuG6hZkDOU_c",
      authDomain: "portal-jogadores-de-dama.firebaseapp.com",
      projectId: "portal-jogadores-de-dama",
      storageBucket: "portal-jogadores-de-dama.firebasestorage.app",
      messagingSenderId: "58381213060",
      appId: "1:58381213060:web:14d476a88e5869fdb311d1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const container = document.getElementById('conteudo-perfil');

      if(!id) {
        container.innerHTML = '<div class="loading" style="color:red;">Jogador não encontrado (ID ausente).</div>';
        return;
      }

      try {
        const docRef = doc(db, "jogadores", id);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const p = docSnap.data();
          
          let idadeStr = 'Não informada';
          if (p.dataNascimento) {
            const nasc = new Date(p.dataNascimento);
            if (!isNaN(nasc)) {
              const hoje = new Date();
              let idade = hoje.getFullYear() - nasc.getFullYear();
              const m = hoje.getMonth() - nasc.getMonth();
              if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) {
                idade--;
              }
              idadeStr = idade + ' anos';
            }
          }

          container.innerHTML = `
            <div class="perfil-container">
              <img src="${p.foto}" alt="${p.nome}" class="perfil-foto">
              <div class="perfil-info">
                <h2>${p.nome}</h2>
                <span class="perfil-cidade">📍 ${p.bairro || 'Bairro não inf.'}, ${p.cidade || 'Cidade não inf.'}</span>
                <p class="perfil-bio">${p.bio || 'Nenhuma biografia disponível para este jogador.'}</p>
                
                <div class="info-grid">
                  <div class="info-box">
                    <span class="info-label">Contato</span>
                    <span class="info-value">📱 ${p.tel || 'Não informado'}</span>
                  </div>
                  <div class="info-box">
                    <span class="info-label">Idade</span>
                    <span class="info-value">🎂 ${idadeStr}</span>
                  </div>
                  <div class="info-box">
                    <span class="info-label">Membro desde</span>
                    <span class="info-value">🗓️ ${p.dataCadastro ? new Date(p.dataCadastro).toLocaleDateString('pt-BR') : 'Data desconhecida'}</span>
                  </div>
                </div>
              </div>
            </div>
            
            <div style="margin-top: 60px;">
              <h3>Desempenho Online (Lidraughts)</h3>
              <div id="lidraughts-stats" style="margin-top: 16px; padding: 24px; background: var(--surface); border-radius: 12px; border: 1px solid var(--line);">
                <div style="color: var(--muted); text-align: center;">Carregando estatísticas do Lidraughts...</div>
              </div>
            </div>

            <div style="margin-top: 40px;">
              <h3>Rating Nacional Oficial</h3>
              <div id="nacional-stats" style="margin-top: 16px; padding: 24px; background: var(--surface); border-radius: 12px; border: 1px solid var(--line);">
                <div style="color: var(--muted); text-align: center;">Buscando dados na CBJD (ratingdamas.org)...</div>
              </div>
            </div>

            <div style="margin-top: 40px; margin-bottom: 60px;">
              <h3>Resultados em Torneios Locais</h3>
              <p style="color: var(--muted); font-size: 0.9rem; margin-top: 8px; margin-bottom: 0;">
                ℹ️ <i>Aviso: Os resultados exibidos nesta seção serão repassados exclusivamente pela federação, liga ou associação responsável, e devem ser devidamente comprovados.</i>
              </p>
              <div style="overflow-x: auto; margin-top: 16px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--line);">
                  <thead>
                    <tr style="background: var(--bg); color: var(--muted); font-family: var(--f-mono); font-size: 0.85rem; text-transform: uppercase;">
                      <th style="padding: 16px; border-bottom: 1px solid var(--line);">Data</th>
                      <th style="padding: 16px; border-bottom: 1px solid var(--line);">Torneio</th>
                      <th style="padding: 16px; border-bottom: 1px solid var(--line);">Modalidade</th>
                      <th style="padding: 16px; border-bottom: 1px solid var(--line);">Colocação</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="4" style="padding: 32px; text-align: center; color: var(--muted);">
                        Nenhum resultado oficial registrado recentemente para este jogador.
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          `;
          document.title = p.nome + " - Portal do Damista";

          if (p.lidraughts) {
            fetch(`https://lidraughts.org/api/user/${p.lidraughts}`)
              .then(res => res.json())
              .then(data => {
                if(data.error || data.closed) {
                  document.getElementById('lidraughts-stats').innerHTML = `<p style="color:var(--muted); text-align: center; margin: 0;">Usuário <b>${p.lidraughts}</b> está fechado ou não existe no Lidraughts.</p>`;
                  return;
                }
                
                const blitzPerf = data.perfs && data.perfs.blitz ? data.perfs.blitz : { rating: 'N/A', games: 0 };
                const blitzRating = blitzPerf.rating;
                const totalGames = blitzPerf.games || 0;
                
                // Renderizar imediatamente o básico para não deixar a tela vazia esperando
                document.getElementById('lidraughts-stats').innerHTML = `
                  <div class="info-grid" style="margin-top: 0;" id="lidraughts-grid">
                    <div class="info-box" style="border-color: var(--accent); background: var(--accent-soft);">
                      <span class="info-label" style="color: var(--accent);">Rating Blitz</span>
                      <span class="info-value" style="font-size: 1.8rem; color: var(--accent);">🏆 ${blitzRating}</span>
                    </div>
                    <div class="info-box">
                      <span class="info-label">Partidas Jogadas</span>
                      <span class="info-value">⛂ ${totalGames}</span>
                    </div>
                    <div class="info-box">
                      <span class="info-label">Status Atual</span>
                      <span class="info-value">${data.online ? '🟢 Online' : '⚪ Offline'}</span>
                    </div>
                    <div class="info-box" style="background: var(--ink); color: white; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; cursor: pointer;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'" onclick="window.open('${data.url}', '_blank')">
                      <span style="color: white; font-weight: bold; text-decoration: none;">↗ Ver no Lidraughts</span>
                    </div>
                  </div>
                `;

                // Buscar página de estatísticas detalhadas do Blitz para pegar recordes
                const statsUrl = `https://lidraughts.org/@/${p.lidraughts}/perf/blitz`;
                fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(statsUrl)}`)
                  .then(res2 => res2.json())
                  .then(htmlData => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlData.contents, 'text/html');
                    
                    let highRating = '-';
                    let lowRating = '-';
                    let winStreak = '-';
                    let loseStreak = '-';
                    
                    try {
                      const highNode = doc.querySelector('.highlow > div:nth-child(1) h2 strong');
                      if(highNode) highRating = highNode.textContent.trim();
                      
                      const lowNode = doc.querySelector('.highlow > div:nth-child(2) h2 strong');
                      if(lowNode) lowRating = lowNode.textContent.trim();
                      
                      const winNode = doc.querySelector('.resultStreak > div:nth-child(1) .streak:nth-of-type(1) h3');
                      if(winNode) {
                        const val = winNode.querySelector('green, red, strong, span');
                        if (val) winStreak = val.textContent.trim();
                        else winStreak = winNode.textContent.replace(/.*:/, '').trim();
                      }
                      
                      const loseNode = doc.querySelector('.resultStreak > div:nth-child(2) .streak:nth-of-type(1) h3');
                      if(loseNode) {
                        const val = loseNode.querySelector('green, red, strong, span');
                        if (val) loseStreak = val.textContent.trim();
                        else loseStreak = loseNode.textContent.replace(/.*:/, '').trim();
                      }
                      
                      if (highRating !== '-') {
                        const grid = document.getElementById('lidraughts-grid');
                        const btn = grid.lastElementChild;
                        grid.removeChild(btn); // Remove temporariamente o botao "Ver no Lidraughts"
                        
                        grid.innerHTML += `
                          <div class="info-box">
                            <span class="info-label">Maior Pontuação</span>
                            <span class="info-value" style="color: var(--good);">📈 ${highRating}</span>
                          </div>
                          <div class="info-box">
                            <span class="info-label">Menor Pontuação</span>
                            <span class="info-value" style="color: var(--bad);">📉 ${lowRating}</span>
                          </div>
                          <div class="info-box">
                            <span class="info-label">Maior Série de Vitórias</span>
                            <span class="info-value" style="color: var(--good);">🔥 ${winStreak}</span>
                          </div>
                          <div class="info-box">
                            <span class="info-label">Maior Série de Derrotas</span>
                            <span class="info-value" style="color: var(--bad);">🧊 ${loseStreak}</span>
                          </div>
                        `;
                        grid.appendChild(btn); // Adiciona o botao de volta no final
                      }
                    } catch(e) {}
                  }).catch(e => console.log('Erro ao buscar stats extra', e));
              })
              .catch(err => {
                document.getElementById('lidraughts-stats').innerHTML = `<p style="color:var(--muted); text-align: center; margin: 0;">Erro ao carregar dados da API do Lidraughts.</p>`;
              });
          } else {
             document.getElementById('lidraughts-stats').innerHTML = `<p style="color:var(--muted); text-align: center; margin: 0;">Este jogador ainda não vinculou uma conta do Lidraughts.</p>`;
          }

          // Buscar Rating Nacional via CORS Proxy
          const urlBusca = `https://ratingdamas.org/rating?search=${encodeURIComponent(p.nome)}`;
          fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(urlBusca)}`)
            .then(res => res.json())
            .then(data => {
              const parser = new DOMParser();
              const doc = parser.parseFromString(data.contents, 'text/html');
              const trs = doc.querySelectorAll('table tbody tr');
              let ratingEncontrado = null;
              
              for (let tr of trs) {
                const tds = tr.querySelectorAll('td');
                if (tds.length > 3) {
                  const nomeNaTabela = tds[1].textContent.trim().toLowerCase();
                  if (nomeNaTabela.includes(p.nome.toLowerCase()) || p.nome.toLowerCase().includes(nomeNaTabela)) {
                    ratingEncontrado = {
                      reg: tds[0].textContent.trim(),
                      uf: tds[2].textContent.trim(),
                      r100c: tds[6].textContent.trim()
                    };
                    
                    if (ratingEncontrado.uf === 'MA' || ratingEncontrado.uf === '') {
                        break;
                    } else {
                        ratingEncontrado = null; // Ignora se não for do Maranhão
                    }
                  }
                }
              }

              if (ratingEncontrado && ratingEncontrado.r100c !== '0') {
                const maxRating = ratingEncontrado.r100c;
                
                document.getElementById('nacional-stats').innerHTML = `
                  <div class="info-grid" style="margin-top: 0;">
                    <div class="info-box" style="border-color: var(--gold); background: var(--gold-soft);">
                      <span class="info-label" style="color: var(--gold);">Rating 100 Casas CBJD</span>
                      <span class="info-value" style="font-size: 1.8rem; color: var(--gold);">🏅 ${maxRating}</span>
                    </div>
                    <div class="info-box">
                      <span class="info-label">Modalidade</span>
                      <span class="info-value">100 casas</span>
                    </div>
                    <div class="info-box">
                      <span class="info-label">Registro / UF</span>
                      <span class="info-value">Nº ${ratingEncontrado.reg} (${ratingEncontrado.uf || 'N/I'})</span>
                    </div>
                    <div class="info-box" style="background: var(--ink); color: white; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; cursor: pointer;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'" onclick="window.open('${urlBusca}', '_blank')">
                      <span style="color: white; font-weight: bold; text-decoration: none;">↗ Ver Perfil Oficial</span>
                    </div>
                  </div>
                `;
              } else {
                document.getElementById('nacional-stats').innerHTML = `
                  <div style="text-align: center; color: var(--muted);">
                    <p style="margin-bottom: 12px;">Não encontramos um rating nacional associado a "${p.nome}".</p>
                    <a href="${urlBusca}" target="_blank" class="btn ghost" style="padding: 6px 12px; font-size: 0.9rem;">Buscar manualmente no site</a>
                  </div>
                `;
              }
            })
            .catch(err => {
              document.getElementById('nacional-stats').innerHTML = `<p style="color:var(--muted); text-align: center; margin: 0;">Não foi possível consultar o site RatingDamas no momento.</p>`;
            });
        } else {
          container.innerHTML = '<div class="loading" style="color:red;">Nenhum jogador encontrado com este ID. Ele pode ter sido deletado.</div>';
        }
      } catch (error) {
        console.error("Erro ao buscar documento:", error);
        container.innerHTML = '<div class="loading" style="color:red;">Erro de conexão com o banco de dados.</div>';
      }
    }

    loadProfile();
  </script>
</body>
</html>
